name: Deploy existing Hugging Face API (manual opt-in)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type deploy-hosted-api after approving hosting, costs, state and signing identity'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hf-jep-api-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'deploy-hosted-api'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'huggingface_hub>=1.31,<2' 'httpx>=0.28,<1'
      - run: python scripts/deploy_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JEP_REVISION: ${{ github.sha }}
