name: Deploy existing Hugging Face API
on:
  workflow_dispatch:
  workflow_run:
    workflows: [Publish versioned release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: hf-jep-api-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'huggingface_hub>=1.31,<2' 'httpx>=0.28,<1'
      - run: python scripts/deploy_hf.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          JEP_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
