name: Publish versioned release
on:
  push:
    branches: [main]
    paths: [VERSION, '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jep
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: jep
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JEP_TEST_DATABASE_URL: postgresql://jep:test-only@localhost:5432/jep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q
      - run: mkdir -p dist && git archive --format=tar.gz --output=dist/jep-api-source.tar.gz HEAD
      - name: Validate release version
        run: |
          python -c "import pathlib,re; v=pathlib.Path('VERSION').read_text().strip(); assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:a[0-9]+)?',v)"
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish versioned GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cat VERSION)
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'This version already has a release; refusing to overwrite it.'
            exit 1
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --notes-file RELEASE-NOTES.md dist/*
  container:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/hjs-spec/jep-api:${{ steps.version.outputs.version }}
          build-args: JEP_REVISION=${{ github.sha }}
